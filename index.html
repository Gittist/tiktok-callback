<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>TikTok Login</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; background: #fff; color: #111; }
  textarea { width: 100%; height: 120px; font-family: monospace; font-size: 13px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 8px 16px; font-size: 15px; cursor: pointer; }
  .err { color: #b00020; }
</style>
</head>
<body>
<h1>TikTok Login</h1>
<p id="msg">Kopiere die Adresse unten und füge sie in PowerShell bei <code>podcast-shorts auth tiktok</code> ein.</p>
<textarea id="url" readonly></textarea>
<button id="copy">Kopieren</button> <span id="done"></span>
<script>
  // Nur Anzeige im Browser, nichts wird irgendwohin gesendet.
  var box = document.getElementById("url");
  var msg = document.getElementById("msg");
  box.value = location.href;
  var q = new URLSearchParams(location.search);
  if (q.get("error")) {
    msg.className = "err";
    msg.textContent = "TikTok meldet einen Fehler: " + q.get("error") + " " + (q.get("error_description") || "");
  } else if (!q.get("code")) {
    msg.textContent = "Keine Anmeldedaten in der Adresse. Diese Seite ist nur das Ziel der TikTok-Anmeldung.";
  }
  document.getElementById("copy").onclick = function () {
    box.select();
    (navigator.clipboard ? navigator.clipboard.writeText(box.value) : Promise.reject()).then(
      function () { document.getElementById("done").textContent = "Kopiert"; },
      function () { document.execCommand("copy"); document.getElementById("done").textContent = "Kopiert"; });
  };
</script>
</body>
</html>
